[package]
name = "exchange8-gateway"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Exchange8-dev/exchange8-gateway"
rust-version = "1.85"
description = "Sentin8 exchange8 gateway service."

[[bin]]
name = "exchange8-gateway"
path = "src/main.rs"


[dependencies]
# Platform SDK pin (RS 2.3) - the only cross-repo dependency; carries the
# entire shared library workspace behind the `sentin8` facade.
sentin8 = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v0.6.5" }
# exchange8 namespace facade pin - carries this vertical's contracts/clients.
exchange8 = { git = "https://github.com/Exchange8-dev/exchange8-sdk", tag = "exchange8-v0.5.4" }

anyhow = "1"
axum = { version = "0.8", features = ["macros", "ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros", "rust_decimal"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1"
tower = { version = "0.5", features = ["util", "util"] }
sentin8-cron-sdk = { git = "https://github.com/Sentin8/sentin8-cron", tag = "cron-sdk-v0.6.3" }
sentin8-secrets-sdk = { git = "https://github.com/Sentin8/sentin8-secrets", tag = "secrets-sdk-v0.3.0" }
